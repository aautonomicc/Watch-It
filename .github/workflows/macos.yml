name: macOS build

# Runs on release tags (like the Windows zip) and on manual dispatch for
# ad-hoc builds. Produces an UNSIGNED ad-hoc-signed .dmg — first-run needs
# right-click → Open (or `xattr -d com.apple.quarantine`) to pass
# Gatekeeper; a real signing cert is a beta/1.0 concern. The Rust core is
# built for BOTH arches and lipo'd so the dmg runs on Apple Silicon and
# Intel Macs alike (flutter build macos is universal by default).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/watchit_core
      - name: Build watchit_core (Rust cdylib, universal)
        working-directory: native/watchit_core
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --lib --target aarch64-apple-darwin
          cargo build --release --lib --target x86_64-apple-darwin
          lipo -create -output libwatchit_core.dylib \
            target/aarch64-apple-darwin/release/libwatchit_core.dylib \
            target/x86_64-apple-darwin/release/libwatchit_core.dylib
          lipo -info libwatchit_core.dylib
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - name: Build Flutter macOS app
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
      # Publish quality tiers need ffmpeg/ffprobe beside the app executable
      # (FfmpegService looks in the resolvedExecutable's dir = Contents/
      # MacOS). Static GPL builds from martin-riedl.de (libx264 + aac, no
      # dylib deps), one per arch, lipo'd universal like the Rust core.
      # GPL is fine: released binaries are GPLv3 combined works already.
      - name: Bundle ffmpeg (martin-riedl 9.0.1 static, pinned, universal)
        run: |
          set -euo pipefail
          base="https://ffmpeg.martin-riedl.de/download/macos"
          arm="$base/arm64/1787073674_9.0.1"
          amd="$base/amd64/1787081194_9.0.1"
          fetch() {
            curl -fsSL --retry 3 -o "$3" "$1"
            echo "$2  $3" | shasum -a 256 -c -
          }
          fetch "$arm/ffmpeg.zip"  8287a1b2229e05eb41859f073e18e6c52c60a778f2f5e6881070fe51b79407fe ffmpeg-arm64.zip
          fetch "$arm/ffprobe.zip" 102a26b8940a053298d9929bfaae71e4b6ef65ba5f19a99a88c433108560741a ffprobe-arm64.zip
          fetch "$amd/ffmpeg.zip"  5bdead62ff504ab9b447cc72b212c4fb481e3f7de5877d427a51bee8136dda40 ffmpeg-amd64.zip
          fetch "$amd/ffprobe.zip" 34511bbcf1988ad2886023bf5ace4f44cf62e6defeb3d194d6f7619e5b061f7f ffprobe-amd64.zip
          for bin in ffmpeg ffprobe; do
            unzip -o -q "$bin-arm64.zip" -d "ff-arm64-$bin"
            unzip -o -q "$bin-amd64.zip" -d "ff-amd64-$bin"
            lipo -create -output "$bin" \
              "ff-arm64-$bin/$bin" "ff-amd64-$bin/$bin"
            lipo -info "$bin"
          done
          APP="app/build/macos/Build/Products/Release/W@tch.app"
          test -d "$APP"
          install -m 755 ffmpeg ffprobe "$APP/Contents/MacOS/"
          "$APP/Contents/MacOS/ffprobe" -version | head -1
      # The Rust core isn't wired into the Xcode project; it's bundled
      # post-build (embedded_client.dart dlopens Contents/Frameworks/
      # explicitly). Adding files breaks the build's ad-hoc seal, so the
      # whole bundle is re-signed ad-hoc afterwards.
      - name: Bundle Rust core and re-sign
        run: |
          APP="app/build/macos/Build/Products/Release/W@tch.app"
          test -d "$APP"
          mkdir -p "$APP/Contents/Frameworks"
          cp native/watchit_core/libwatchit_core.dylib "$APP/Contents/Frameworks/"
          codesign --force --sign - "$APP/Contents/Frameworks/libwatchit_core.dylib"
          codesign --force --sign - "$APP/Contents/MacOS/ffmpeg" \
            "$APP/Contents/MacOS/ffprobe"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
      - name: Create dmg
        run: |
          mkdir dmg-root
          cp -R "app/build/macos/Build/Products/Release/W@tch.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "W@tch" -srcfolder dmg-root -ov \
            -format UDZO Watch-It-macos.dmg
          ls -lh Watch-It-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Watch-It-macos
          path: Watch-It-macos.dmg
