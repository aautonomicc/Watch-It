name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android-artifact-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/build_android.sh native/build-android.sh
      - run: python3 -m unittest discover -s scripts -p 'test_android_apk.py'

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
