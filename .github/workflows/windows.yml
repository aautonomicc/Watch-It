name: Windows build

# Runs on release tags (the zip is a standing release artifact since
# alpha.55) and on manual dispatch for ad-hoc builds. The Rust tree
# (ant-core → aws-lc, vendored OpenSSL, evmlib/alloy) takes ~40+ min
# cold on a Windows runner; grab the zip from the run's artifacts.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # aws-lc-sys (via rustls) and the vendored OpenSSL both assemble
      # with NASM on MSVC targets; the runner image doesn't ship it.
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/watchit_core
      - name: Build watchit_core (Rust cdylib)
        working-directory: native/watchit_core
        run: cargo build --release --lib
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - name: Build Flutter Windows app
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      # Publish quality tiers need ffmpeg/ffprobe beside watchit.exe.
      # BtbN shared build (small exes + DLLs shared between them) is
      # ~half the size of two static exes; pinned tag + sha256 keeps the
      # build reproducible. ffplay is dropped.
      - name: Bundle ffmpeg (BtbN win64-gpl-shared, pinned)
        shell: pwsh
        run: |
          $tag = "autobuild-2026-08-25-13-06"
          $name = "ffmpeg-n8.1.2-44-g7c533d0f86-win64-gpl-shared-8.1"
          $sha256 = "53c28beda739244ac70784e09edff8fe915acca68e7eb8952d97cd5a015ea146"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$name.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) { throw "ffmpeg.zip sha256 mismatch: $actual" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
          $out = "app/build/windows/x64/runner/Release"
          Copy-Item "ffmpeg-dist/$name/bin/ffmpeg.exe" $out/
          Copy-Item "ffmpeg-dist/$name/bin/ffprobe.exe" $out/
          Copy-Item "ffmpeg-dist/$name/bin/*.dll" $out/
          & "$out/ffprobe.exe" -version
      - name: Assemble bundle
        shell: pwsh
        run: |
          $out = "app/build/windows/x64/runner/Release"
          Copy-Item native/watchit_core/target/release/watchit_core.dll $out/
          Compress-Archive -Path "$out/*" -DestinationPath Watch-It-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Watch-It-windows-x64
          path: Watch-It-windows-x64.zip
