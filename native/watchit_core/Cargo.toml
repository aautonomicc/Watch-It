[package]
name = "watchit_core"
version = "0.1.0"
edition = "2021"
description = "Embedded Autonomi client + localhost streaming server for Watch-It"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "devserver"
path = "src/bin/devserver.rs"

[build-dependencies]
cc = "1"

[dependencies]
# Pinned to ant-core 0.9.0 (tag ant-core-v0.9.0). Still exposes
# Client::file_download_to_sender + self_encryption 0.36 get_range seek;
# brings the V2-903 download-diagnostics stack (node-GET correlation,
# flush-after-failed-download) + settlement-version quote gate.
ant-core = { git = "https://github.com/WithAutonomi/ant-client", rev = "785a155ce044fc5fb3f9a7106e990eee264b2be2" }
self_encryption = "0.36"
# Upload-wallet key derivation; the mnemonic feature adds the
# BIP-39/BIP-32 path (m/44'/60'/0'/0/0, MetaMask-compatible). 2.x may
# resolve a second alloy tree beside evmlib's — acceptable: wallet.rs
# only derives key hex + address strings, no cross-tree types.
# BIP-39 mnemonics come via `alloy_signer_local::coins_bip39` (the
# crate's public re-export) instead of a direct coins-bip39 dep — a
# direct dep at a different version than alloy's internal pin (0.12)
# makes MnemonicBuilder reject our Wordlist type (hit at the 2026-09-14
# upgrade when 0.13 was tried); the re-export can never diverge.
alloy-signer-local = { version = "2.4.2", features = ["mnemonic"] }
rand = "0.8"
axum = "0.8"
# blake3 + rmp-serde mirror ant-core's address derivation (compute_address
# over the rmp-serde-encoded shrunk data map) for offline map verification.
blake3 = "1"
bytes = "1"
futures = "0.3"
hex = "0.4"
rmp-serde = "1"
base64 = "0.22"
# artwork transfer integrity (already in the x0x tree, so free)
sha2 = "0.10"
# Reverse-QR pairing (My W@tch): the unlinked device shows an ephemeral
# x25519 public key as a QR; a linked device seals the 32-byte link
# secret to it and publishes the box on a short-lived gossip topic.
# Both crates are already in the dependency tree (x0x pulls them), so
# these direct deps add no new code to the build. static_secrets: the
# receiver must reuse its ephemeral key across every candidate message.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
# Channel identity (all three already in the dependency tree, so these
# direct deps add no new code to the build): Ed25519 channel keys +
# head-record signatures, SLIP-0010 derivation from the BIP-39 seed,
# base32 channel codes (wchn1-…).
ed25519-dalek = "3"
hmac = "0.12"
data-encoding = "2"
# bundled: compiles its own SQLite, so Android/cross builds need no system lib
# HELD AT 0.32 (2026-09-14 dep-upgrade audit): x0x itself depends on
# rusqlite ^0.32, and rusqlite's native-sqlite `links` key allows only
# ONE version per dependency graph — bumping here is impossible until
# x0x bumps. Zero cost: the single shared copy is the current one.
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xor_name = "5"

[dev-dependencies]
# Router::oneshot in the /rootmap endpoint tests.
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

# Upload-wallet key storage in the OS keychain (Windows Credential
# Manager / macOS Keychain / Secret Service over zbus — pure Rust, no
# libdbus link, matching the alpha.53 lesson about system-lib deps).
# Desktop only: upload is desktop-only, and on Android keyring would
# silently use its non-persistent mock store.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos", target_os = "android"))'.dependencies]
# My W@tch device linking: an in-process x0x agent (saorsa-gossip +
# ant-quic, post-quantum, mDNS LAN discovery) syncs lists/viewpoints
# through a self-keyed CRDT KV store on a secret invite topic. Android
# included since the NDK cross-build of the x0x tree was proven.
# 0.43–0.45 (the 2026-09-13/14 release burst): 0.43.0's BREAKING
# change is the upgrade-path library API only (AutoApplyUpgrader —
# unused here; the Agent API is unchanged) + ant-quic 0.27.51 transport
# fixes (#278 stale conn after disconnect, #280 single accept_bi
# consumer, #283 shutdown drain); 0.44.0 makes relay fan-out lazy for
# non-consumed topics (#674) + ant-quic 0.27.52 joins accept workers on
# shutdown; 0.45.0 pins saorsa-gossip 0.5.81 (#58 dedupe read-lock —
# the measured #656 CPU fix — + #41 bounded per-topic peer state + #42
# IHAVE-flusher shutdown livelock fix). Idle-bandwidth note: #622 (leaf
# egress budget) still open, so no leaf idle-traffic change expected.
# Pin a release, never git main.
x0x = "0.45.0"
# CancellationToken for the mywatch heartbeat/watch task (already in the
# x0x tree, so free on desktop).
tokio-util = "0.7"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
# keyring 4 restructured into a facade over keyring-core + per-platform
# store crates; the default `v1` feature keeps the old Entry API and
# picks Keychain / Credential Manager / Secret Service automatically.
# The zbus Secret Service store resolves zbus with async-io (never the
# tokio feature whose block_on panics on a runtime thread — the old
# alpha.55 lesson); wallet.rs still runs every keyring call on a
# dedicated plain thread as belt and braces.
keyring = "4"

# NOTE: ant-quic was vendored at ../third_party/ant-quic from 0.27.44
# through 0.27.47 purely to bump its exact unicode-width =0.2.0 pin
# (conflicting with saorsa-transport's =0.2.2). ant-quic 0.27.48 relaxed
# the pin to ^0.2.2 upstream, so the vendored copy and its
# [patch.crates-io] entry were removed 2026-09-04.

[profile.release]
lto = "thin"
strip = "symbols"
