[package]
name = "watchit_core"
version = "0.1.0"
edition = "2021"
description = "Embedded Autonomi client + localhost streaming server for Watch-It"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "devserver"
path = "src/bin/devserver.rs"

[build-dependencies]
cc = "1"

[dependencies]
# Pinned to ant-core 0.8.1 (tag ant-core-v0.8.1). Still exposes
# Client::file_download_to_sender + self_encryption 0.36 get_range seek;
# pulls saorsa-core 0.27.3 (starved-routing-table runtime recovery, and
# the version upstream PR WithAutonomi/saorsa-core#160 targets).
ant-core = { git = "https://github.com/WithAutonomi/ant-client", rev = "dbc01ce8fdbdfe9ac4d064d35f36b4684bf6a616" }
self_encryption = "0.36"
# Upload-wallet key derivation: pinned to the alloy minor evmlib 0.9
# already resolves to (no second alloy tree); the mnemonic feature adds
# the BIP-39/BIP-32 path (m/44'/60'/0'/0/0, MetaMask-compatible).
alloy-signer-local = { version = "1.8.3", features = ["mnemonic"] }
coins-bip39 = { version = "0.12", default-features = false, features = ["english"] }
rand = "0.8"
axum = "0.8"
# blake3 + rmp-serde mirror ant-core's address derivation (compute_address
# over the rmp-serde-encoded shrunk data map) for offline map verification.
blake3 = "1"
bytes = "1"
futures = "0.3"
hex = "0.4"
rmp-serde = "1"
base64 = "0.22"
# artwork transfer integrity (already in the x0x tree, so free)
sha2 = "0.10"
# Channel identity (all three already in the dependency tree, so these
# direct deps add no new code to the build): Ed25519 channel keys +
# head-record signatures, SLIP-0010 derivation from the BIP-39 seed,
# base32 channel codes (wchn1-…).
ed25519-dalek = "2"
hmac = "0.12"
data-encoding = "2"
# bundled: compiles its own SQLite, so Android/cross builds need no system lib
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xor_name = "5"

[dev-dependencies]
# Router::oneshot in the /rootmap endpoint tests.
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

# Upload-wallet key storage in the OS keychain (Windows Credential
# Manager / macOS Keychain / Secret Service over zbus — pure Rust, no
# libdbus link, matching the alpha.53 lesson about system-lib deps).
# Desktop only: upload is desktop-only, and on Android keyring would
# silently use its non-persistent mock store.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos", target_os = "android"))'.dependencies]
# My W@tch device linking: an in-process x0x agent (saorsa-gossip +
# ant-quic, post-quantum, mDNS LAN discovery) syncs lists/viewpoints
# through a self-keyed CRDT KV store on a secret invite topic. Android
# included since the NDK cross-build of the x0x tree was proven.
# 0.41.x carries the issue-#380 idle-bandwidth campaign (leaf mode
# enforced, V3 slim announces, replay-storm validators via saorsa-gossip
# 0.5.75) plus the ADR-0036–43 Home wave with its mixed-fleet regressions
# (#448/#450/#451) fixed in-release; pin a release, never git main.
x0x = "0.41.1"
# CancellationToken for the mywatch heartbeat/watch task (already in the
# x0x tree, so free on desktop).
tokio-util = "0.7"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3", default-features = false, features = [
    "windows-native",
    "apple-native",
    "async-secret-service",
    "crypto-rust",
    # async-io, NOT tokio: with the tokio feature zbus block_on panics
    # ("Cannot start a runtime from within a runtime") when a keychain
    # call happens on a runtime thread — and it killed the connect
    # supervisor. async-io gives zbus its own executor; wallet.rs also
    # runs every keyring call on a dedicated plain thread.
    "async-io",
] }

# NOTE: ant-quic was vendored at ../third_party/ant-quic from 0.27.44
# through 0.27.47 purely to bump its exact unicode-width =0.2.0 pin
# (conflicting with saorsa-transport's =0.2.2). ant-quic 0.27.48 relaxed
# the pin to ^0.2.2 upstream, so the vendored copy and its
# [patch.crates-io] entry were removed 2026-09-04.

[profile.release]
lto = "thin"
strip = "symbols"
