[package]
name = "watchit_core"
version = "0.1.0"
edition = "2021"
description = "Embedded Autonomi client + localhost streaming server for Watch-It"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "devserver"
path = "src/bin/devserver.rs"

[build-dependencies]
cc = "1"

[dependencies]
# Pinned to the commit the Phase 0 streaming spike verified (ant-core 0.4.0):
# Client::file_download_to_sender + self_encryption 0.36 get_range seek.
ant-core = { git = "https://github.com/WithAutonomi/ant-client", rev = "629b87fc2560653e96084596721e9564c47f4181" }
self_encryption = "0.36"
axum = "0.8"
# blake3 + rmp-serde mirror ant-core's address derivation (compute_address
# over the rmp-serde-encoded shrunk data map) for offline map verification.
blake3 = "1"
bytes = "1"
futures = "0.3"
hex = "0.4"
rmp-serde = "1"
# bundled: compiles its own SQLite, so Android/cross builds need no system lib
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xor_name = "5"

[dev-dependencies]
# Router::oneshot in the /rootmap endpoint tests.
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[profile.release]
lto = "thin"
strip = "symbols"
